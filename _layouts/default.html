<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header" role="banner">
      <div class="header-inner">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
          <span class="wordmark-mark" aria-hidden="true">✳</span>
          <span>{{ site.title }}</span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">Home</a>
          <details>
            <summary>Explore the lenses</summary>
            <div class="nav-menu">
              {% for item in site.data.navigation %}
                <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
              {% endfor %}
            </div>
          </details>
        </nav>
      </div>
    </header>

    <main id="main-content" tabindex="-1">
      {{ content }}
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="footer-inner">
        <p class="footer-title">Make the commonplace visible.</p>
        <p>A working field guide to communication theory, ordinary problems, and AI.</p>
        <a href="{{ '/' | relative_url }}">Back to the beginning</a>
      </div>
    </footer>
  </body>
</html>
