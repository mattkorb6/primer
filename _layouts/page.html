---
layout: default
---
<article class="article-shell">
  <div class="article-kicker">{{ page.kicker | default: "A communication theory field guide" }}</div>
  <h1>{{ page.title }}</h1>
  {% if page.intro %}<p class="article-intro">{{ page.intro }}</p>{% endif %}
  <div class="article-rule" aria-hidden="true"></div>
  <div class="prose">
    {{ content }}
  </div>
</article>
